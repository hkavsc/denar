<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a56b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Skupni denar</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f9f8fd;--hd:#efeff2;--card:#fff;--tx:#1d1d24;--mu:#7a7a86;--bd:#e6e5ee;--ac:#4a56b8;--pl:#e1e1f7;--ex:#e8588a;--in:#19a98f;--on:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14141a;--hd:#1d1d25;--card:#1f1f28;--tx:#ececf3;--mu:#9a9aa8;--bd:#2f2f3b;--ac:#8d98f0;--pl:#2d2f4d;--ex:#f06c98;--in:#37c9ae;--on:#14141a;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
header{background:var(--hd);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;position:sticky;top:0;z-index:5}
.hd{display:flex;justify-content:space-between;align-items:center}.tot{text-align:center}.tot small{display:block}.tot b{font-size:22px}
.mn{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pill{background:var(--pl);border-radius:20px;padding:8px 18px;font-weight:600;text-transform:uppercase;font-size:14px}
main{max-width:720px;margin:0 auto;padding:14px}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
button{cursor:pointer}.ib{border:0;background:none;font-size:22px;padding:4px 10px}
.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{display:flex;justify-content:space-between;color:var(--ac);margin:16px 0 8px;font-size:18px}
.ex{color:var(--ex)}.in{color:var(--in)}.mu,small{color:var(--mu);font-size:13px}
.ic{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex:none;color:#fff;font-weight:700}
.r{display:flex;align-items:center;gap:12px;padding:9px 0}.r>div:nth-child(2){flex:1;min-width:0}
.sp{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.day{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--bd);padding-top:10px;margin-top:6px}.day b:first-child{font-size:28px;font-weight:300}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:13px}.grid .ic{width:56px;height:56px;margin:2px auto;display:flex}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}
.two,.three{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.three{grid-template-columns:repeat(3,1fr)}.two>div,.three>div{border-radius:14px;padding:10px;text-align:center;background:var(--card);border:1px solid var(--bd)}
.ch{width:100%;height:auto;font-size:9px;fill:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;border-radius:14px;font-size:20px;line-height:1.1;padding:6px 0}nav small{display:block;font-size:10px}nav .on{background:var(--pl);font-weight:700}nav .on small{color:var(--tx)}
#fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;font-size:30px;background:var(--pl);border:0;z-index:6;padding:0}
.modal{position:fixed;inset:0;background:#0008;z-index:9;display:flex}.modal>form{background:var(--bg);width:100%;max-width:720px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:92vh;overflow:auto}
.modal .w{grid-column:1/-1}.modal input:not([type=checkbox]),.modal select{width:100%}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.setup input{width:100%;margin:4px 0 10px}#err{color:var(--ex);font-size:14px;margin-bottom:8px}.bi{width:100px;text-align:right;padding:5px 8px}
</style>
</head>
<body>
<header>
  <div class="hd"><button class="ib" id="cog" aria-label="Nastavitve">👤</button><div class="tot"><small>Vsi računi</small><b id="tot">—</b></div><span style="width:48px"></span></div>
  <div class="mn" id="mnav" hidden><button class="ib" id="prev" aria-label="Prejšnji mesec">«</button><span class="pill" id="mon"></span><button class="ib" id="next" aria-label="Naslednji mesec">»</button></div>
  <div class="seg" id="pf" hidden style="margin-top:8px"></div>
</header>
<main>
  <div id="err"></div>
  <section id="setup" class="card setup">
    <strong>Prijava in povezava</strong>
    <p class="mu">Podatki so v Google Preglednici, ki si jo delita. Postopek nastavitve je v NAVODILA.md.</p>
    <label class="mu">OAuth Client ID</label><input id="cid" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off">
    <label class="mu">Povezava do Google Preglednice</label><input id="sh" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off">
    <button class="p" id="login" style="width:100%">Prijava z Google</button>
    <div id="imp" hidden style="margin-top:18px"><strong>Uvoz iz 1Money</strong><p class="mu">Izberi datoteko uvoz-1money.csv (enkrat samo na enem telefonu).</p><input id="ipn" placeholder="Čigavi so ti vnosi? (npr. Katja)"><input type="file" id="file" accept=".csv,text/csv"><div id="ip" class="mu"></div></div>
    <button id="back" hidden style="width:100%;margin-top:10px">Nazaj</button>
  </section>
  <section id="view" hidden></section>
</main>
<nav id="nav" hidden>
  <button data-v="acc">👛<small>Računi</small></button><button data-v="cat">🥧<small>Kategorije</small></button><button data-v="tx">🧾<small>Transakcije</small></button>
  <button data-v="bud">🎯<small>Proračun</small></button><button data-v="ov">📊<small>Pregled</small></button><button data-v="sk">👥<small>Skupaj</small></button>
</nav>
<button id="fab" hidden aria-label="Nov vnos">+</button>
<div class="modal" id="sheet" hidden>
  <form id="f">
    <div class="seg w" id="seg"><button type="button" data-t="odhodek" class="on">Odhodek</button><button type="button" data-t="prihodek">Prihodek</button><button type="button" data-t="prenos">Prenos</button></div>
    <input class="w" id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Znesek (€)" required>
    <input id="cat" list="dc" placeholder="Kategorija" autocomplete="off"><input id="acc" list="da" placeholder="Račun" autocomplete="off"><input id="acc2" list="da" placeholder="Na račun" autocomplete="off" hidden>
    <input id="date" type="date" required><input id="note" placeholder="Opomba" maxlength="120">
    <datalist id="dc"></datalist><datalist id="da"></datalist>
    <button type="button" id="cancel">Prekliči</button><button class="p" type="submit">Dodaj</button>
  </form>
</div>
<script>
const $=s=>$$(s)[0],$$=s=>document.querySelectorAll(s),LS=localStorage,SK="Skupni račun";
const SC="https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.profile";
const MN=["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"],WD=["nedelja","ponedeljek","torek","sreda","četrtek","petek","sobota"];
const PAL=["#4da3f5","#f5c518","#4caf50","#ef5b8a","#a56cd9","#ff9a3c","#26b5a5","#7a86e0","#e0654f","#8bc34a","#00acc1","#c2849b"];
const p2=n=>String(n).padStart(2,"0"),ym=d=>d.getFullYear()+"-"+p2(d.getMonth()+1),ymd=d=>ym(d)+"-"+p2(d.getDate()),today=()=>ymd(new Date());
let tok=(LS.tok&&+LS.exp>Date.now())?LS.tok:null,sid=LS.sid||"",cid=LS.cid||"",who=LS.who||"",rows=[],bal={},bud={},tab=["acc","cat","tx","bud","ov","sk"].includes(LS.tab)?LS.tab:"acc",pf=LS.pf||"",per="m",ftype="odhodek",timer,month=ym(new Date());
const fmt=n=>(Math.round(n*100)/100).toLocaleString("sl-SI",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const err=t=>$("#err").textContent=t||"",sum=a=>a.reduce((s,x)=>s+x.amt,0);
const col=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return PAL[h%PAL.length]};
const ico=s=>{const m=s.match(/\p{Extended_Pictographic}/u);return m?m[0]:(s.trim()[0]||"?").toUpperCase()};
const aic=n=>/kartic/i.test(n)?"💳":/gotov/i.test(n)?"👛":/prihr|varč/i.test(n)?"🐷":n===SK?"👥":ico(n);
const mr=()=>rows.filter(x=>x.date.slice(0,7)===month&&(!pf||x.by===pf)),pick=(R,t)=>R.filter(x=>x.t===t);
const cs=t=>{const o={};pick(mr(),t).forEach(x=>o[x.cat]=(o[x.cat]||0)+x.amt);return o};
const cats=t=>[...new Set(pick(rows,t).map(x=>x.cat))];

async function api(path,opt={}){
  const r=await fetch("https://sheets.googleapis.com/v4/spreadsheets/"+sid+path,{...opt,headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"}});
  if(r.status===401){tok=null;LS.removeItem("tok");showSetup();err("Seja je potekla. Prijavi se znova.");throw new Error("auth")}
  if(!r.ok){let m=r.status;try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}
  return r.json();
}
async function ensure(){
  const m=await api("?fields=sheets.properties.title");
  if(!(m.sheets||[]).some(s=>s.properties.title==="Vnosi"))await api(":batchUpdate",{method:"POST",body:JSON.stringify({requests:[{addSheet:{properties:{title:"Vnosi"}}}]})});
  await api("/values/Vnosi!A1:I1?valueInputOption=RAW",{method:"PUT",body:JSON.stringify({values:[["datum","vrsta","kategorija","znesek","opomba","oseba","račun","skupno","račun2"]]})});
}
async function load(){
  try{
    const d=await api("/values/Vnosi!A2:I?valueRenderOption=UNFORMATTED_VALUE");
    rows=(d.values||[]).map((r,i)=>({n:i+2,date:String(r[0]||""),t:r[1],cat:String(r[2]||""),amt:+r[3]||0,note:r[4]||"",by:String(r[5]||""),acc:String(r[6]||""),sk:r[7]==="da",acc2:String(r[8]||"")})).filter(x=>x.t);
    err();render();
  }catch(e){if(e.message!=="auth")err("Napaka: "+e.message)}
}
const add=async v=>{await api("/values/Vnosi!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{method:"POST",body:JSON.stringify({values:[v]})});await load()};
function derive(){
  bal={};bud={};const ad=(a,v)=>{if(a)bal[a]=(bal[a]||0)+v};
  rows.forEach(x=>{if(x.t==="odhodek")ad(x.acc,-x.amt);else if(x.t==="prihodek"||x.t==="začetno")ad(x.acc,x.amt);else if(x.t==="prenos"){ad(x.acc,-x.amt);ad(x.acc2,x.amt)}else if(x.t==="proračun")bud[x.cat]=x.amt});
}
function rowH(x,dl){
  const tr=x.t==="prenos",ps=x.t==="poravnava",c=x.t==="prihodek"?"in":(tr||ps)?"mu":"ex";
  return `<div class="r"><i class="ic" style="background:${tr||ps?"#8a8fa8":col(x.cat)}">${tr?"⇄":ps?"🤝":esc(ico(x.cat))}</i><div><div>${tr?"Prenos":ps?"Poravnava":esc(x.cat)}</div><small>${esc(tr?x.acc+" → "+x.acc2:x.acc)}${x.by&&x.by!=="Uvoz"?" · "+esc(x.by):""}</small>${x.note?`<div><small><i>${esc(x.note)}</i></small></div>`:""}</div><div style="text-align:right"><span class="${c}">${fmt(x.amt)}</span>${dl?`<br><button class="ib" style="font-size:13px;padding:0" data-n="${x.n}" aria-label="Izbriši">✕</button>`:""}</div></div>`;
}
const catRow=(n,v,c)=>`<div class="r"><i class="ic" style="background:${col(n)}">${esc(ico(n))}</i><div class="sp"><span>${esc(n)}</span><b class="${c}">${fmt(v)}</b></div></div>`;

function vAcc(){
  const names=Object.keys(bal);
  const sv=names.filter(n=>/prihr|varč/i.test(n)),ac=names.filter(n=>!sv.includes(n));
  const g=(t,l)=>`<h3><span>${t}</span><b>${fmt(sum(l.map(n=>({amt:bal[n]||0}))))}</b></h3>`+l.map(n=>`<div class="r"><i class="ic" style="background:${col(n)}">${esc(aic(n))}</i><div><div>${esc(n)}</div><b class="${(bal[n]||0)<0?"ex":"in"}">${fmt(bal[n]||0)}</b></div></div>`).join("");
  return g("Računi",ac)+g("Prihranki",sv);
}
function vCat(){
  const e=cs("odhodek"),inc=sum(pick(mr(),"prihodek")),T=sum(Object.values(e).map(v=>({amt:v}))),C=2*Math.PI*70;let off=0,arcs="";
  Object.entries(e).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{const l=v/T*C;arcs+=`<circle cx="100" cy="100" r="70" fill="none" stroke="${col(n)}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l});
  const all=cats("odhodek").sort((a,b)=>(e[b]||0)-(e[a]||0)||a.localeCompare(b));
  return `<div class="card"><svg viewBox="0 0 200 200" style="width:100%;max-width:250px;display:block;margin:auto"><circle cx="100" cy="100" r="70" fill="none" stroke="var(--bd)" stroke-width="20"/>${arcs}<text x="100" y="92" text-anchor="middle" style="fill:var(--tx);font-size:13px">Stroški</text><text x="100" y="112" text-anchor="middle" style="fill:var(--ex);font-size:17px;font-weight:600">${fmt(T)}</text><text x="100" y="130" text-anchor="middle" style="fill:var(--in);font-size:12px">${fmt(inc)}</text></svg></div><div class="grid">${all.map(n=>`<div><div>${esc(n)}</div><i class="ic" style="background:${col(n)}">${esc(ico(n))}</i><b>${fmt(e[n]||0)}</b></div>`).join("")}</div>`;
}
function vTx(){
  const L=mr().filter(x=>!["proračun","začetno"].includes(x.t)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.n-a.n);
  if(!L.length)return'<p class="mu">Ta mesec ni vnosov.</p>';
  const g={};L.forEach(x=>(g[x.date]=g[x.date]||[]).push(x));
  return Object.keys(g).map(d=>`<div class="day"><span><b>${d.slice(8)}</b> <small>${WD[new Date(d+"T12:00:00").getDay()]}</small></span><b class="ex" style="font-size:18px">${fmt(sum(pick(g[d],"odhodek")))}</b></div>`+g[d].map(x=>rowH(x,1)).join("")).join("");
}
function vBud(){
  const e=cs("odhodek"),inc=cs("prihodek"),cl=[...new Set([...cats("odhodek"),...Object.keys(bud)])].sort((a,b)=>(e[b]||0)-(e[a]||0)||a.localeCompare(b));
  return `<div class="card"><div class="sp"><b>Stroški</b><b class="ex">${fmt(sum(pick(mr(),"odhodek")))}</b></div><div class="sp"><small>porabljeno</small><small>proračunsko ${fmt(cl.reduce((s,n)=>s+(bud[n]||0),0))}</small></div></div>`+
  cl.map(n=>{const s=e[n]||0,b=bud[n]||0,o=b&&s>b;return `<div class="r"><i class="ic" style="background:${col(n)}">${esc(ico(n))}</i><div><div class="sp"><span>${esc(n)}</span><b class="${o?"ex":""}">${fmt(s)}</b></div><div class="bar" style="margin:6px 0"><i style="width:${b?Math.min(100,s/b*100):0}%;background:${o?"var(--ex)":col(n)}"></i></div></div><input class="bi" type="number" inputmode="decimal" min="0" placeholder="proračun" value="${b||""}" data-b="${esc(n)}"></div>`}).join("")+
  `<h3><span>Dohodki</span><b class="in">${fmt(sum(Object.values(inc).map(v=>({amt:v}))))}</b></h3>`+Object.entries(inc).map(([n,v])=>catRow(n,v,"in")).join("");
}
function chartDays(){
  const [y,m]=month.split("-").map(Number),n=new Date(y,m,0).getDate(),day=Array.from({length:n},()=>({}));
  pick(mr(),"odhodek").forEach(x=>{const d=+x.date.slice(8,10)-1;if(day[d])day[d][x.cat]=(day[d][x.cat]||0)+x.amt});
  const mx=Math.max(1,...day.map(o=>Object.values(o).reduce((a,b)=>a+b,0))),W=300/n;let s="";
  day.forEach((o,i)=>{let yb=108;Object.entries(o).forEach(([c,v])=>{const h=v/mx*95;yb-=h;s+=`<rect x="${i*W+1}" y="${yb}" width="${Math.max(1,W-2)}" height="${h}" fill="${col(c)}"/>`})});
  return `<svg viewBox="0 0 300 125" class="ch">${s}<text x="0" y="121">1</text><text x="150" y="121" text-anchor="middle">${Math.round(n/2)}</text><text x="300" y="121" text-anchor="end">${n}</text><text x="300" y="9" text-anchor="end">${Math.round(mx)} €</text></svg>`;
}
function chart12(){
  const [y,m]=month.split("-").map(Number),ms=[];for(let k=11;k>=0;k--)ms.push(ym(new Date(y,m-1-k,1)));
  const E={},I={};rows.filter(x=>!pf||x.by===pf).forEach(x=>{const k=x.date.slice(0,7);if(x.t==="odhodek")E[k]=(E[k]||0)+x.amt;else if(x.t==="prihodek")I[k]=(I[k]||0)+x.amt});
  const mx=Math.max(1,...ms.map(k=>Math.max(E[k]||0,I[k]||0))),W=25;let s="";
  ms.forEach((k,i)=>{const e=(E[k]||0)/mx*95,n=(I[k]||0)/mx*95;s+=`<rect x="${i*W+2}" y="${108-e}" width="10" height="${e}" fill="var(--ex)"/><rect x="${i*W+12}" y="${108-n}" width="10" height="${n}" fill="var(--in)"/><text x="${i*W+12}" y="121" text-anchor="middle">${+k.slice(5)}</text>`});
  return {svg:`<svg viewBox="0 0 300 125" class="ch">${s}</svg>`,avg:ms.reduce((a,k)=>a+(E[k]||0),0)/12,avgI:ms.reduce((a,k)=>a+(I[k]||0),0)/12};
}
function vOv(){
  const m=mr(),ex=sum(pick(m,"odhodek")),inc=sum(pick(m,"prihodek")),e=cs("odhodek"),[y,mo]=month.split("-").map(Number),n=new Date(y,mo,0).getDate(),now=new Date();
  const dn=month===ym(now)?now.getDate():n,wk=ymd(new Date(Date.now()-6*864e5)),ex1=pick(rows,"odhodek").filter(x=>!pf||x.by===pf),c12=chart12();
  return `<div style="text-align:center"><small>Stanje</small><div style="font-size:26px" class="${inc-ex<0?"ex":"in"}">${fmt(inc-ex)}</div></div>
<div class="two"><div style="background:var(--ex);color:#fff"><small style="color:#fff">Stroški</small><div style="font-size:22px">${fmt(ex)}</div></div><div><small>Dohodki</small><div class="in" style="font-size:22px">${fmt(inc)}</div></div></div>
<div class="card">${chartDays()}</div>
<div class="three"><div><small>Dan (povp.)</small><div class="ex">${fmt(ex/dn)}</div></div><div><small>Danes</small><div>${fmt(sum(ex1.filter(x=>x.date===today())))}</div></div><div><small>Teden</small><div>${fmt(sum(ex1.filter(x=>x.date>=wk&&x.date<=today())))}</div></div></div>
${Object.entries(e).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="r"><i class="ic" style="background:${col(c)}">${esc(ico(c))}</i><div><div class="sp"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar" style="margin-top:6px"><i style="width:${v/ex*100}%;background:${col(c)}"></i></div><small>${Math.round(v/ex*100)} %</small></div></div>`).join("")}
<h3><span>Zadnjih 12 mesecev</span></h3><div class="card">${c12.svg}<div class="sp"><small><b class="ex">■</b> stroški (povp. ${fmt(c12.avg)})</small><small><b class="in">■</b> dohodki (povp. ${fmt(c12.avgI)})</small></div></div>`;
}
const PC=["#4da3f5","#ef5b8a","#26b5a5","#ff9a3c"];
function people(){const c={};rows.forEach(x=>{if(x.by&&x.by!=="Uvoz")c[x.by]=(c[x.by]||0)+1});if(who&&!c[who])c[who]=0;return Object.keys(c).sort((a,b)=>a===who?-1:b===who?1:c[b]-c[a])}
function vSk(){
  const y=month.slice(0,4),R=rows.filter(x=>per==="m"?x.date.slice(0,7)===month:per==="l"?x.date.slice(0,4)===y:true),E=pick(R,"odhodek"),I=pick(R,"prihodek");
  const P=[...new Set([...people(),...R.filter(x=>x.t==="odhodek"||x.t==="prihodek").map(x=>x.by)])],pc=p=>PC[P.indexOf(p)%4],cm={};
  E.forEach(x=>{const o=cm[x.cat]=cm[x.cat]||{};o[x.by]=(o[x.by]||0)+x.amt});
  const tt=c=>Object.values(cm[c]).reduce((a,b)=>a+b,0),T=sum(E),cl=Object.keys(cm).sort((a,b)=>tt(b)-tt(a));
  return `<div class="seg" style="margin-bottom:10px">${[["m","Mesec"],["l","Leto"],["a","Vse"]].map(([k,l])=>`<button data-p="${k}" class="${per===k?"on":""}">${l}</button>`).join("")}</div>
<div class="card"><small>Skupaj stroški (${per==="m"?MN[+month.slice(5,7)-1]+" "+y:per==="l"?y:"vse obdobje"})</small><div style="font-size:26px" class="ex">${fmt(T)}</div><small>Dohodki: ${fmt(sum(I))}</small>
${P.map(p=>`<div class="sp" style="margin-top:8px"><span><b style="color:${pc(p)}">■</b> ${esc(p||"?")}</span><span><b class="ex">${fmt(sum(E.filter(x=>x.by===p)))}</b> <small>dohodki ${fmt(sum(I.filter(x=>x.by===p)))}</small></span></div>`).join("")}</div>
${cl.map(c=>`<div class="r"><i class="ic" style="background:${col(c)}">${esc(ico(c))}</i><div><div class="sp"><span>${esc(c)}</span><b>${fmt(tt(c))}</b></div><div class="bar" style="margin:6px 0;display:flex">${P.map(p=>`<i style="width:${(cm[c][p]||0)/T*100}%;background:${pc(p)}"></i>`).join("")}</div><small>${P.filter(p=>cm[c][p]).map(p=>esc(p||"?")+" "+fmt(cm[c][p])).join(" · ")}</small></div></div>`).join("")||'<p class="mu">Ni vnosov v tem obdobju.</p>'}`;
}
const V={acc:vAcc,cat:vCat,tx:vTx,bud:vBud,ov:vOv,sk:vSk};
function render(){
  if(!tok||$("#view").hidden)return;derive();
  $("#tot").textContent=fmt(Object.values(bal).reduce((a,b)=>a+b,0));
  const [y,m]=month.split("-");$("#mon").textContent=MN[+m-1]+" "+y;$("#mnav").hidden=tab==="acc";const PP=people();$("#pf").hidden=tab==="acc"||tab==="sk"||PP.length<2;$("#pf").innerHTML=["",...PP].map(p=>`<button type="button" data-f="${esc(p)}" class="${pf===p?"on":""}">${p?esc(p):"Vsi"}</button>`).join("");
  $("#view").innerHTML=V[tab]();$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===tab));
}
function lists(){
  $("#da").innerHTML=[...new Set([...Object.keys(bal),SK])].map(a=>`<option value="${esc(a)}">`).join("");
  $("#dc").innerHTML=(ftype==="prenos"?[]:cats(ftype)).map(a=>`<option value="${esc(a)}">`).join("");
}
function setT(t){
  ftype=t;$$("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("#cat").hidden=t==="prenos";$("#acc2").hidden=t!=="prenos";$("#acc").placeholder=t==="prenos"?"Iz računa":"Račun";lists();
}
function showSetup(){$("#setup").hidden=false;$("#view").hidden=true;$("#nav").hidden=true;$("#fab").hidden=true;$("#mnav").hidden=true;$("#cid").value=cid;$("#sh").value=sid;$("#imp").hidden=!tok;$("#ipn").value=who;$("#back").hidden=!tok;clearInterval(timer)}
function start(){$("#setup").hidden=true;$("#view").hidden=false;$("#nav").hidden=false;$("#fab").hidden=false;err();load();clearInterval(timer);timer=setInterval(load,30000)}
function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r}

$("#login").onclick=()=>{
  cid=$("#cid").value.trim();const m=$("#sh").value.match(/[-\w]{25,}/);sid=m?m[0]:"";
  if(!cid||!sid)return err("Vnesi Client ID in povezavo do preglednice.");
  if(!window.google)return err("Google prijava se še nalaga ali ni dosegljiva. Preveri internet in poskusi znova.");
  LS.cid=cid;LS.sid=sid;
  google.accounts.oauth2.initTokenClient({client_id:cid,scope:SC,callback:onTok,error_callback:e=>err("Prijava ni uspela ("+(e.type||"napaka")+").")}).requestAccessToken();
};
async function onTok(r){
  if(r.error)return err("Prijava ni uspela: "+r.error);
  tok=r.access_token;LS.tok=tok;LS.exp=Date.now()+(r.expires_in-60)*1000;
  try{const u=await(await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+tok}})).json();who=u.given_name||u.name||"Jaz";LS.who=who;await ensure();start()}
  catch(e){if(e.message!=="auth")err("Napaka: "+e.message)}
}
$("#pf").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;pf=b.dataset.f;LS.pf=pf;render()};
$("#cog").onclick=showSetup;$("#back").onclick=start;
$("#prev").onclick=()=>{const d=new Date(month+"-01T12:00:00");d.setMonth(d.getMonth()-1);month=ym(d);render()};
$("#next").onclick=()=>{const d=new Date(month+"-01T12:00:00");d.setMonth(d.getMonth()+1);month=ym(d);render()};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.v;LS.tab=tab;render();scrollTo(0,0)};
$("#fab").onclick=()=>{$("#sheet").hidden=false;$("#date").value=today();$("#acc").value=LS.acc||(bal.Kartice!=null?"Kartice":Object.keys(bal)[0]||"");$("#amt").value="";$("#note").value="";setT("odhodek")};
$("#cancel").onclick=()=>$("#sheet").hidden=true;
$("#seg").onclick=e=>{const b=e.target.closest("button");if(b)setT(b.dataset.t)};
$("#f").onsubmit=async e=>{
  e.preventDefault();const a=parseFloat($("#amt").value),t=ftype,c=$("#cat").value.trim(),ac=$("#acc").value.trim(),a2=$("#acc2").value.trim();
  if(!(a>0))return;if(!ac||(t==="prenos"?!a2:!c))return err("Izpolni kategorijo in račun.");
  try{await add([$("#date").value,t,t==="prenos"?"":c,a,$("#note").value.trim(),who,ac,"",t==="prenos"?a2:""]);LS.acc=ac;$("#sheet").hidden=true;err()}
  catch(x){if(x.message!=="auth")err("Shranjevanje ni uspelo: "+x.message)}
};
$("#view").onclick=async e=>{
  const pb=e.target.closest("[data-p]");if(pb){per=pb.dataset.p;render();return}
  const d=e.target.closest("[data-n]"),s=e.target.closest("[data-d]");
  try{
    if(d&&confirm("Izbrišem ta vnos?")){await api("/values/Vnosi!A"+d.dataset.n+":I"+d.dataset.n+":clear",{method:"POST",body:"{}"});await load()}
    else if(s)await add([today(),"poravnava","Poravnava",+s.dataset.a,"",s.dataset.d,"","",""]);
  }catch(x){if(x.message!=="auth")err("Napaka: "+x.message)}
};
$("#view").onchange=async e=>{const t=e.target;if(t.dataset.b===undefined)return;const v=parseFloat(t.value);
  try{await add([today(),"proračun",t.dataset.b,isNaN(v)?0:v,"",who,"","",""])}catch(x){if(x.message!=="auth")err("Napaka: "+x.message)}};
$("#file").onchange=async e=>{
  const f=e.target.files[0],nm=$("#ipn").value.trim();e.target.value="";if(!f)return;if(!nm)return err("Vpiši, čigavi so uvoženi vnosi.");const R=parseCSV((await f.text()).replace(/^\uFEFF/,"")).filter(r=>r.length>=7);
  if(!R.length||R[0][0]!=="datum")return err("Datoteka nima pričakovane oblike.");R.shift();
  if(rows.some(x=>x.t==="začetno")&&!confirm("Uvoz je že narejen. Uvozim znova (vnosi bodo podvojeni)?"))return;
  try{
    for(let i=0;i<R.length;i+=400){
      const ch=R.slice(i,i+400).map(r=>{while(r.length<9)r.push("");r[3]=+r[3];r[5]=nm;return r.slice(0,9)});
      await api("/values/Vnosi!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{method:"POST",body:JSON.stringify({values:ch})});
      $("#ip").textContent="Uvoženih "+Math.min(i+400,R.length)+" od "+R.length;
    }
    await load();$("#ip").textContent="Uvoz končan: "+R.length+" vnosov.";err();
  }catch(x){if(x.message!=="auth")err("Uvoz ni uspel: "+x.message)}
};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tok&&sid&&!$("#view").hidden)load()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(tok&&sid)start();else showSetup();
</script>
</body>
</html>
