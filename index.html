<!DOCTYPE html>

<style>

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
header{background:var(--hd);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;position:sticky;top:0;z-index:5}
.hd{display:flex;justify-content:space-between;align-items:center}.mn{display:flex;align-items:center;gap:4px}
.pill{background:var(--pl);border:0;border-radius:20px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--tx)}
main{max-width:720px;margin:0 auto;padding:14px}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
button{cursor:pointer}.ib{border:0;background:none;font-size:22px;padding:4px 10px}
.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{display:flex;justify-content:space-between;color:var(--ac);margin:16px 0 8px;font-size:18px}
.ex{color:var(--ex)}.in{color:var(--in)}.mu,small{color:var(--mu);font-size:13px}
.ic{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;flex:none;color:#fff;font-weight:700}
.r{display:flex;align-items:center;gap:12px;padding:9px 0}.r>div:nth-child(2){flex:1;min-width:0}
.sp{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.day{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--bd);padding-top:10px;margin-top:6px}.day b:first-child{font-size:28px;font-weight:300}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:13px}.grid>div{cursor:pointer}.grid .ic{width:56px;height:56px;margin:2px auto;display:flex}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}
.two,.three{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.three{grid-template-columns:repeat(3,1fr)}.two>div,.three>div{border-radius:14px;padding:10px;text-align:center;background:var(--card);border:1px solid var(--bd)}
.ch{width:100%;height:auto;font-size:9px;fill:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--hd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;border-radius:14px;font-size:20px;line-height:1.1;padding:6px 0}nav small{display:block;font-size:10px}nav .on{background:var(--pl);font-weight:700}nav .on small{color:var(--tx)}
#fab,#eye{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:16px;font-size:28px;background:var(--pl);border:0;z-index:6;padding:0}
#eye.on{background:var(--ac);color:var(--on)}
.plus{width:40px;height:40px;border-radius:50%;font-size:22px;padding:0;background:var(--pl);border:0;flex:none}
.modal{position:fixed;inset:0;background:#0008;z-index:9;display:flex}.modal>form{background:var(--bg);width:100%;max-width:720px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:92vh;overflow:auto}
.modal .w{grid-column:1/-1}.modal input:not([type=checkbox]),.modal select{width:100%}.modal label{display:block}.modal button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
#seg button{padding:9px 2px;font-size:14px}.seg{display:flex;gap:6px}.seg button{flex:1}.seg .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.setup input{width:100%;margin:4px 0 10px}#err{color:var(--ex);font-size:14px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <div class="hd"><button class="ib" id="cog" aria-label="Nastavitve">👤</button>
    <div class="mn" id="mnav" hidden><button class="ib" id="prev" aria-label="Prejšnje obdobje">«</button><button class="pill" id="mon"></button><button class="ib" id="next" aria-label="Naslednje obdobje">»</button></div>
    <b id="ttl">Finance</b><span style="width:48px"></span></div>
  <div class="seg" id="pf" hidden style="margin-top:8px"></div>
</header>
<main>
  <div id="err"></div>
  <section id="setup" class="card setup">
    <strong>Prijava in povezava</strong>
    <p class="mu">Podatki so v Google Preglednici, ki si jo delita. Postopek nastavitve je v NAVODILA.md.</p>
    <label class="mu">OAuth Client ID</label><input id="cid" placeholder="xxxx.apps.googleusercontent.com" autocomplete="off">
    <label class="mu">Povezava do Google Preglednice</label><input id="sh" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off">
    <button class="p" id="login" style="width:100%">Prijava z Google</button>
    <p class="mu" style="text-align:center;margin:12px 0 0"><a href="zasebnost.html">Zasebnost / Privacy policy</a></p>
    <div id="imp" hidden style="margin-top:18px"><strong>Uvoz iz 1Money</strong><p class="mu">Izberi datoteko uvoz-1money.csv (enkrat samo na enem telefonu).</p><input id="ipn" placeholder="Čigavi so ti vnosi? (npr. Katja)"><input type="file" id="file" accept=".csv,text/csv"><div id="ip" class="mu"></div>
    <button id="rstfp" style="width:100%;margin-top:14px">Ponastavi prstni odtis</button></div>
    <button id="back" hidden style="width:100%;margin-top:10px">Nazaj</button>
    <button id="logout" hidden style="width:100%;margin-top:10px">Odjava</button>
  </section>
  <section id="view" hidden></section>
</main>
<nav id="nav" hidden>
  <button data-v="acc">👛<small>Računi</small></button><button data-v="cat">🥧<small>Kategorije</small></button><button data-v="tx">🧾<small>Transakcije</small></button>
  <button data-v="ov">📊<small>Pregled</small></button><button data-v="sk">👥<small>Skupaj</small></button>
</nav>
<button id="fab" hidden aria-label="Nov vnos">+</button>
<button id="eye" hidden aria-label="Pokaži zneske">👁</button>
<div class="modal" id="sheet" hidden>
  <form id="f">
    <div class="seg w" id="seg"><button type="button" data-t="odhodek" class="on">Odhodek</button><button type="button" data-t="prihodek">Prihodek</button><button type="button" data-t="prenos">Prenos</button><button type="button" data-t="povračilo">Povračilo</button></div>
    <input class="w" id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Znesek (€)" required>
    <input id="cat" list="dc" placeholder="Kategorija" autocomplete="off"><input id="acc" list="da" placeholder="Račun" autocomplete="off"><input id="acc2" list="da" placeholder="Na račun" autocomplete="off" hidden>
    <input id="date" type="date" required><input id="note" placeholder="Opomba" maxlength="120">
    <datalist id="dc"></datalist><datalist id="da"></datalist>
    <button type="button" id="cancel">Prekliči</button><button class="p" type="submit">Dodaj</button>
  </form>
</div>
<div class="modal" id="vm" hidden><form id="vf"></form></div>
<div id="lock" style="position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center">
  <img src="icon-192.png" width="120" height="120" alt="" style="border-radius:26px"><b style="font-size:24px">Finance</b>
  <button class="p" id="lbtn" style="padding:12px 30px;font-size:18px">🔒 Odkleni</button>
  <div id="lerr" style="color:var(--ex);font-size:14px;max-width:320px"></div><button id="lcont" hidden>Nadaljuj brez zaklepa</button>
</div>
<script>
const $=s=>$$(s)[0],$$=s=>document.querySelectorAll(s),LS=localStorage,enc=encodeURIComponent,dec=decodeURIComponent;
const SC="https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.profile";
const MN=["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"],WD=["nedelja","ponedeljek","torek","sreda","četrtek","petek","sobota"];
const PAL=["#4da3f5","#f5c518","#4caf50","#ef5b8a","#a56cd9","#ff9a3c","#26b5a5","#7a86e0","#e0654f","#8bc34a","#00acc1","#c2849b"],PC=["#4da3f5","#ef5b8a","#26b5a5","#ff9a3c"];
const ACC=["Bančni račun Katja","Predplačniška Katja","Gotovina Katja","Bančni račun Rok","Predplačniška Rok","Gotovina Rok","Gotovina hidden place"];
const SAV=["Triglav Investments","Etoro","Bitstamp","Pokojninski sklad Domel"];
const LOANS=[{n:"Gorenjska Banka kredit",w:"Rok"},{n:"Intesa Ekosklad kredit Rok",w:"Rok"},{n:"Intesa Ekosklad kredit Katja",w:"Katja"},{n:"Meta kredit",w:""}],LN=LOANS.map(l=>l.n);
const p2=n=>String(n).padStart(2,"0"),ym=d=>d.getFullYear()+"-"+p2(d.getMonth()+1),ymd=d=>ym(d)+"-"+p2(d.getDate()),today=()=>ymd(new Date());
const sh=s=>`${+s.slice(8)}. ${+s.slice(5,7)}. ${s.slice(0,4)}`,db=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5),dAdd=(s,n)=>ymd(new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8)+n));
let tok=(LS.tok&&+LS.exp>Date.now())?LS.tok:null,sid=LS.sid||"",cid=LS.cid||"",who=LS.who||"",rows=[],bal={},R={a:"",b:"",lab:""},timer,rv=false,rvT,selCat="",ftype="odhodek";
let tab=["acc","cat","tx","ov","sk"].includes(LS.tab)?LS.tab:"acc",pf=LS.pf||"",pr={k:"m",off:0};try{pr=JSON.parse(LS.pr)||pr}catch(e){}
const fmt=n=>(Math.round(n*100)/100).toLocaleString("sl-SI",{minimumFractionDigits:2,maximumFractionDigits:2})+" €",mk=n=>rv?fmt(n):"•••• €";
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
const err=t=>$("#err").textContent=t||"",sum=a=>a.reduce((s,x)=>s+x.amt,0),cmp=(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.n-b.n;
const col=s=>{let h=0;for(const c of s)h=(h*31+c.codePointAt(0))>>>0;return PAL[h%PAL.length]};
const ico=s=>{const m=s.match(/\p{Extended_Pictographic}/u);return m?m[0]:(s.trim()[0]||"?").toUpperCase()};
const aic=n=>/banč/i.test(n)?"🏦":/predpl/i.test(n)?"💳":/gotov/i.test(n)?"👛":ico(n);
const inR=x=>x.date>=R.a&&x.date<=R.b,mr=()=>rows.filter(x=>inR(x)&&(!pf||x.by===pf)),pick=(L,t)=>L.filter(x=>x.t===t);
const cs=t=>{const o={};pick(mr(),t).forEach(x=>o[x.cat]=(o[x.cat]||0)+x.amt);return o};
const cats=t=>[...new Set(pick(rows,t).map(x=>x.cat))],lastV=n=>{const v=rows.filter(x=>x.t==="vrednost"&&x.acc===n).sort(cmp);return v.length?v[v.length-1].amt:0};
const pn=by=>/rok/i.test(by)?"Rok":"Katja",al=(a,by)=>a==="Kartice"?"Bančni račun "+pn(by):a==="Gotovina"?"Gotovina "+pn(by):a;
const savePr=()=>LS.pr=JSON.stringify(pr);
const cfg=()=>sid&&who&&!LS.out,tokOk=()=>tok&&+LS.exp>Date.now(),setTok=r=>{tok=r.access_token;LS.tok=tok;LS.exp=Date.now()+(r.expires_in-60)*1000};
function expired(){tok=null;LS.removeItem("tok");clearInterval(timer);if(cfg()){$("#lock").hidden=false;$("#lerr").textContent="Seja je potekla. Tapni »Odkleni« za nadaljevanje."}else{showSetup();err("Seja je potekla. Prijavi se znova.")}}
function newToken(){return new Promise((res,rej)=>{
  if(!window.google)return rej(new Error("Google prijava še ni naložena. Poskusi znova."));
  const c={client_id:cid,scope:SC,prompt:"",callback:r=>{if(r.error)return rej(new Error("Prijava ni uspela: "+r.error));setTok(r);if(!LS.sub)fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+tok}}).then(x=>x.json()).then(u=>LS.sub=u.sub||"").catch(()=>{});res()},error_callback:e=>rej(new Error("Prijava ni uspela ("+(e.type||"napaka")+")."))};
  if(LS.sub)c.hint=LS.sub;google.accounts.oauth2.initTokenClient(c).requestAccessToken();
})}

function rng(){
  const n=new Date(),k=pr.k,o=pr.off||0;let a,b,lab;
  if(k==="w"){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)+7*o);a=ymd(d);b=dAdd(a,6);lab=o?sh(a)+" – "+sh(b):"Ta teden"}
  else if(k==="m"){const d=new Date(n.getFullYear(),n.getMonth()+o,1);a=ymd(d);b=ymd(new Date(d.getFullYear(),d.getMonth()+1,0));lab=o?MN[d.getMonth()]+" "+d.getFullYear():"Ta mesec"}
  else if(k==="y"){const y=n.getFullYear()+o;a=y+"-01-01";b=y+"-12-31";lab=o?String(y):"To leto"}
  else if(k==="7"){b=ymd(n);a=dAdd(b,-6);lab="Zadnjih 7 dni"}
  else{a=pr.from||ymd(n);b=pr.to||a;if(b<a)[a,b]=[b,a];lab=sh(a)+" – "+sh(b)}
  return {a,b,lab};
}
async function api(path,opt={}){
  const r=await fetch("https://sheets.googleapis.com/v4/spreadsheets/"+sid+path,{...opt,headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"}});
  if(r.status===401){expired();throw new Error("auth")}
  if(!r.ok){let m=r.status;try{m=(await r.json()).error.message}catch(e){}throw new Error(m)}
  return r.json();
}
async function ensure(){
  const m=await api("?fields=sheets.properties.title");
  if(!(m.sheets||[]).some(s=>s.properties.title==="Vnosi"))await api(":batchUpdate",{method:"POST",body:JSON.stringify({requests:[{addSheet:{properties:{title:"Vnosi"}}}]})});
  await api("/values/Vnosi!A1:I1?valueInputOption=RAW",{method:"PUT",body:JSON.stringify({values:[["datum","vrsta","kategorija","znesek","opomba","oseba","račun","skupno","račun2"]]})});
}
async function load(){
  if(!tokOk()){expired();return}
  try{
    const d=await api("/values/Vnosi!A2:I?valueRenderOption=UNFORMATTED_VALUE");
    rows=(d.values||[]).map((r,i)=>{const by=String(r[5]||""),rf=r[1]==="povračilo";return {n:i+2,date:String(r[0]||""),t:rf?"odhodek":r[1],cat:String(r[2]||""),amt:rf?-(+r[3]||0):(+r[3]||0),rf,note:r[4]||"",by,acc:al(String(r[6]||""),by),acc2:al(String(r[8]||""),by)}}).filter(x=>x.t);
    err();render();
  }catch(e){if(e.message!=="auth")err("Napaka: "+e.message)}
}
const addMany=async L=>{await api("/values/Vnosi!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{method:"POST",body:JSON.stringify({values:L})});await load()},add=v=>addMany([v]);
function derive(){
  bal={};const ad=(a,v)=>{if(a)bal[a]=(bal[a]||0)+v};
  rows.forEach(x=>{if(x.t==="odhodek")ad(x.acc,-x.amt);else if(x.t==="prihodek"||x.t==="začetno")ad(x.acc,x.amt);else if(x.t==="prenos"){ad(x.acc,-x.amt);ad(x.acc2,x.amt)}});
}
function loanCalc(l){
  const sn=rows.filter(x=>x.t==="kredit"&&x.acc===l.n).sort(cmp);if(!sn.length)return {bal:null,rata:0};
  const s=sn[sn.length-1],after=x=>x.date>s.date||(x.date===s.date&&x.n>s.n),rata=+s.note||0,w=l.w.toLowerCase();let b=s.amt;
  rows.forEach(x=>{
    if(w&&x.t==="prihodek"&&/plač/i.test(x.cat)&&after(x)&&((x.by||"").toLowerCase()===w||(x.acc||"").toLowerCase().endsWith(" "+w)))b-=rata;
    if(x.t==="prenos"&&x.acc2===l.n&&after(x))b-=x.amt;
  });
  return {bal:Math.max(0,b),rata};
}
let lbusy=false,hideT=0;
async function verify(){
  if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))throw Object.assign(new Error("Ta naprava ne podpira potrditve s prstnim odtisom ali zaklepom zaslona."),{code:"nosup"});
  const ch=crypto.getRandomValues(new Uint8Array(32));
  if(!LS.cred){
    const c=await navigator.credentials.create({publicKey:{challenge:ch,rp:{name:"Finance"},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:who||"uporabnik",displayName:who||"uporabnik"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
    LS.cred=btoa(String.fromCharCode(...new Uint8Array(c.rawId)));
  }else{
    await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:"public-key",id:Uint8Array.from(atob(LS.cred),c=>c.charCodeAt(0))}],userVerification:"required",timeout:60000}});
  }
}
async function unlock(){
  if(rv)return true;
  try{await verify();rv=true;clearTimeout(rvT);rvT=setTimeout(()=>{rv=false;render()},120000);err();render();return true}
  catch(e){err(e.name==="NotAllowedError"?"Potrditev je bila preklicana ali ni uspela.":(e.message||"Potrditev ni uspela."));return false}
}
async function appUnlock(auto){
  if(lbusy)return;lbusy=true;$("#lerr").textContent="";
  try{
    if(cfg()&&!tokOk()){if(auto)throw Object.assign(new Error(""),{name:"NotAllowedError"});await newToken()}
    await verify();$("#lock").hidden=true;
    if(tokOk()&&sid){if($("#view").hidden)start();else load()}
  }catch(e){$("#lerr").textContent=e.name==="NotAllowedError"?"Tapni »Odkleni« in potrdi s prstnim odtisom ali zaklepom zaslona.":(e.message||"Potrditev ni uspela.");$("#lcont").hidden=e.code!=="nosup"}
  lbusy=false;
}
function openVM(title,html,onOk,onClick,okLabel){
  $("#vf").innerHTML=`<b class="w">${title}</b>${html}<button type="button" data-x="1">Prekliči</button><button class="p" type="submit">${okLabel||"Shrani"}</button>`;$("#vm").hidden=false;
  $("#vf").onclick=ev=>{if(ev.target.closest("[data-x]"))$("#vm").hidden=true;else if(onClick)onClick(ev)};
  $("#vf").onsubmit=async ev=>{ev.preventDefault();try{await onOk(new FormData($("#vf")));$("#vm").hidden=true;err()}catch(x){if(x.message!=="auth")err(x.message)}};
}
function openPeriod(){
  const O=[["w","Ta teden"],["m","Ta mesec"],["y","To leto"],["7","Zadnjih 7 dni"]];
  openVM("Časovno obdobje",O.map(([k,l])=>`<button type="button" class="w ${pr.k===k?"on":""}" data-k="${k}">${l}</button>`).join("")+`<b class="w" style="margin-top:6px">Po meri</b><label class="mu">Od<input name="od" type="date" value="${R.a}"></label><label class="mu">Do<input name="do" type="date" value="${R.b}"></label>`,
    async f=>{const a=f.get("od"),b=f.get("do");if(!a||!b)throw new Error("Izberi obe datumski polji.");pr={k:"c",from:a,to:b,off:0};savePr();render()},
    ev=>{const b=ev.target.closest("[data-k]");if(b){pr={k:b.dataset.k,off:0};savePr();$("#vm").hidden=true;render()}},"Uporabi po meri");
}
function editSav(i){
  const n=SAV[i],v=lastV(n);
  openVM(esc(n),`<label class="w mu">Novo stanje (€)<input name="v" type="number" step="0.01" inputmode="decimal" value="${v||""}" required></label><label class="w mu">Datum<input name="d" type="date" value="${today()}" required></label>`,
    async f=>{await add([f.get("d"),"vrednost","",parseFloat(f.get("v")),"",who,n,"",""])});
}
function editLoans(){

    else if(sg){const n=dec(sg.dataset.seg);selCat=selCat===n?"":n;render()}
    else if(ct)openAdd({cat:dec(ct.dataset.cat)});
    else if(ov)showCat(dec(ov.dataset.ov));
    else if(t.closest("[data-cx]")){selCat="";render()}
  }catch(x){if(x.message!=="auth")err("Napaka: "+x.message)}
};
$("#view").onchange=e=>{if(e.target.dataset.sav!==undefined){LS.sav=e.target.checked?"1":"";render()}};
$("#file").onchange=async e=>{
  const f=e.target.files[0],nm=$("#ipn").value.trim();if(!f)return;
  if(!nm){e.target.value="";return err("Vpiši, čigavi so uvoženi vnosi.")}
  let txt="";try{txt=(await f.text()).replace(/^\uFEFF/,"")}catch(x){e.target.value="";return err("Datoteke ni mogoče prebrati: "+x.message)}
  e.target.value="";const h=txt.split("\n")[0],d=(h.match(/;/g)||[]).length>(h.match(/,/g)||[]).length?";":",";
  const R=parseCSV(txt,d).filter(r=>r.length>=7);
  if(!R.length||String(R[0][0]).trim().toLowerCase()!=="datum")return err("Datoteka nima pričakovane oblike. Prebrano ("+f.name+", "+txt.length+" znakov): "+JSON.stringify(txt.slice(0,40)));
  R.shift();
  if(rows.some(x=>x.t==="začetno")&&!confirm("Uvoz je že narejen. Uvozim znova (vnosi bodo podvojeni)?"))return;
  try{
    for(let i=0;i<R.length;i+=400){
      const ch=R.slice(i,i+400).map(r=>{while(r.length<9)r.push("");r[3]=+r[3];r[5]=nm;return r.slice(0,9)});
      await api("/values/Vnosi!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",{method:"POST",body:JSON.stringify({values:ch})});
      $("#ip").textContent="Uvoženih "+Math.min(i+400,R.length)+" od "+R.length;
    }
    await load();$("#ip").textContent="Uvoz končan: "+R.length+" vnosov.";err();
  }catch(x){if(x.message!=="auth")err("Uvoz ni uspel: "+x.message)}
};
$("#lbtn").onclick=()=>appUnlock(false);$("#lcont").onclick=()=>{$("#lock").hidden=true;if(tokOk()&&sid&&$("#view").hidden)start()};
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){rv=false;hideT=Date.now()}
  else{if(cfg()&&hideT&&Date.now()-hideT>30000&&$("#lock").hidden){$("#lock").hidden=false;appUnlock(true)}if(tok&&sid&&!$("#view").hidden)load()}
});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(cfg()){if(tokOk())start();else tok=null;appUnlock(true)}else{$("#lock").hidden=true;showSetup()}
</script>
</body>
